<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Семейный бюджет</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2f6fed; --red:#d14343; --green:#1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --panel:#1d2128; --text:#e8eaee; --muted:#9aa3af; --line:#2c323b; --accent:#5b8cff; --red:#ff6b6b; --green:#3ecf7a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  button, input, select { font:inherit; color:inherit; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  button { padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost, .ghost { background:transparent; color:var(--text); border:1px solid var(--line); padding:8px 14px; border-radius:8px; cursor:pointer; }
  button.small { padding:2px 8px; }
  .muted { color:var(--muted); }
  /* вход */
  #login { min-height:100vh; display:grid; place-items:center; padding:16px; }
  #login form { width:100%; max-width:340px; background:var(--panel); padding:28px; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,.08); display:grid; gap:12px; }
  #login h1 { margin:0 0 4px; font-size:20px; }
  #err { color:var(--red); min-height:1.2em; margin:0; font-size:14px; }
  /* админка */
  .top { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); gap:12px; }
  .top h1 { margin:0; font-size:18px; }
  .top-right { display:flex; gap:12px; align-items:center; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
  main > *, .grid > * { min-width:0; }
  .card, .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card .label { color:var(--muted); font-size:13px; }
  .card .value { font-size:22px; font-weight:600; margin-top:4px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; align-items:end; }
  .grid label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .grid .wide { grid-column:span 2; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  .row h2 { margin:0; } .row input { width:auto; }
  .row-left { display:flex; gap:10px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:14px; display:block; overflow-x:auto; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  .num { text-align:right; } .expense { color:var(--red); } .income { color:var(--green); } .saving { color:var(--accent); }
  .bycat { display:grid; gap:6px; margin-bottom:14px; }
  .bar { display:grid; grid-template-columns:140px 1fr 110px; gap:10px; align-items:center; font-size:14px; }
  .bar div { background:var(--bg); border-radius:4px; height:10px; } .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .bar b { text-align:right; font-weight:500; }
  @media (max-width:560px) { .grid .wide { grid-column:auto; } .bar { grid-template-columns:90px 1fr 90px; } .top { padding:12px 16px; } }
</style>
</head>
<body>
<div id="login">
  <form id="loginForm" autocomplete="on">
    <h1>Семейный бюджет</h1>
    <p class="muted" style="margin:0">Вход только для своих</p>
    <input name="username" placeholder="Логин" autocomplete="username" required>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit" id="btn">Войти</button>
    <p id="err"></p>
  </form>
</div>
<div id="app" hidden></div>

const SESSION = 'family-budget:session';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function kekFrom(login, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(login.trim().toLowerCase() + '\n' + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(VAULT.salt), iterations: VAULT.iterations },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function openWithRaw(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return new TextDecoder().decode(html);
}
function show(html, user) {
  window.__budgetUser = user;
  const app = document.getElementById('app');
  app.innerHTML = html;
  // скрипты, вставленные через innerHTML, не выполняются — пересоздаём их
  app.querySelectorAll('script').forEach(old => {
    const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s);
  });
  document.getElementById('login').hidden = true;
  app.hidden = false;
}

document.getElementById('loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, btn = document.getElementById('btn'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Проверяю…';
  try {
    const kek = await kekFrom(f.username.value, f.password.value);
    let raw = null;
    for (const slot of VAULT.slots) {
      try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(slot.iv) }, kek, b64(slot.key)); break; } catch {}
    }
    if (!raw) throw new Error('bad');
    const html = await openWithRaw(raw);
    const user = f.username.value.trim();
    sessionStorage.setItem(SESSION, JSON.stringify({ v: VAULT.version, k: ub64(raw), u: user }));
    show(html, user);
  } catch {
    err.textContent = 'Неверный логин или пароль';
  } finally { btn.disabled = false; btn.textContent = 'Войти'; }
});

// не спрашивать пароль повторно в рамках одной вкладки
(async () => {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION));
    if (s && s.v === VAULT.version) show(await openWithRaw(b64(s.k)), s.u);
  } catch { sessionStorage.removeItem(SESSION); }
})();
</script>
