# Выкладывает сервер (worker/) на Cloudflare и записывает его адрес в api.json для сайта.
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATA_REPO_TOKEN, BUDGET_USERS, TELEGRAM_BOT_TOKEN
name: Deploy API

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DATA_REPO_TOKEN
            BUDGET_USERS
            TELEGRAM_BOT_TOKEN
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          BUDGET_USERS: ${{ secrets.BUDGET_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Save API address for the site
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$URL" || { echo "Cloudflare не вернул адрес сервера"; exit 1; }
          printf '{ "api": "%s" }\n' "${URL%/}" > api.json
          if ! git diff --quiet -- api.json || ! git ls-files --error-unmatch api.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add api.json
            git commit -m "Адрес API: $URL"
            git push
          fi

      - name: Check login and data access
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          BUDGET_USERS: ${{ secrets.BUDGET_USERS }}
        run: |
          sleep 5
          first="${BUDGET_USERS%%,*}"
          body=$(jq -n --arg l "${first%%:*}" --arg p "${first#*:}" '{login:$l, password:$p}')
          token=$(curl -sf -X POST "${URL%/}/login" -H 'Content-Type: application/json' -d "$body" | jq -r .token)
          test -n "$token" && test "$token" != null || { echo "Вход не прошёл"; exit 1; }
          curl -sf "${URL%/}/data" -H "Authorization: Bearer $token" \
            | jq -r '"Данные доступны: записей \(.entries|length), история \(.history|length), настройки \(.settings|keys|length) полей"'
